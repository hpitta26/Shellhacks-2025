variables:
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.environ.get]
      path: [translation_agency_v2.agent]
  GOOGLE_GENAI_USE_VERTEXAI:
    type: env
    params:
      caller: [os.environ]

files:
  "..":
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), "..", ".."]
  .json:
    type: literal
    actions: [write]
    params:
      caller: [tempfile.NamedTemporaryFile]
      mode: w
      delete: "False"
  temp_file:
    type: variable
    actions: [delete]
    params:
      caller: [os.unlink]
  website_content.json:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [project_root, translation_agency_v2, website_content.json]
